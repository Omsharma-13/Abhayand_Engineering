# Nginx configuration for Abhyanand Engineering
# Place this file on your server at: /etc/nginx/sites-available/abhyanand-web

# Option 1: Access via custom port (e.g. 8085) -> http://64.227.173.170:8085
server {
    listen 8085;
    server_name 64.227.173.170;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Option 2 (Recommended): Access via standard port 80 with free wildcard domain (no purchase required!)
# Anyone can visit: http://abhyanand.64.227.173.170.nip.io
server {
    listen 80;
    server_name abhyanand.64.227.173.170.nip.io;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
